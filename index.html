<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dicionário Macuxi Multimídia</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    html { scroll-behavior: smooth; }

    /* curva inferior da faixa de apresentação */
    .hero-curve::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 40px;
      background: #f4f1e9;
      clip-path: ellipse(55% 100% at 50% 100%);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp .6s ease forwards; }
  </style>
</head>

<body class="bg-[#f4f1e9]">
  <div id="root"></div>

  <script type="text/babel">

    async function isUserAdmin(userId) {
      if (!userId) return false;
      const { data, error } = await supabaseClient
        .from('admins')
        .select('user_id')
        .eq('user_id', userId)
        .maybeSingle();
      if (error) return false;
      return !!data;
    }

    const { useState, useEffect, useMemo } = React;
    const { createClient } = supabase;

    const config = {
      supabaseUrl: 'https://xujtmchbobzekplacyct.supabase.co',
      supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1anRtY2hib2J6ZWtwbGFjeWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNTQ2OTksImV4cCI6MjA4NzYzMDY5OX0.WSzC6_rOgsrtEPMoGBXBq-L2a1m3-NT_dl76k76nps8',
      tableName: 'tabela_verbetes'
    };

    const supabaseClient = createClient(config.supabaseUrl, config.supabaseAnonKey);

    // =================================================================================
    // UI REUTILIZÁVEL
    // =================================================================================
    const Icon = ({ name }) => {
      const icons = {
        search: (
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="absolute top-1/2 right-4 -translate-y-1/2 text-gray-400">
            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        ),
        book: (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        ),
        volume: (
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="inline-block ml-2 text-gray-400">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        ),
        chevronDown: (
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        )
      };
      return icons[name] || null;
    };

    const Button = ({ onClick, children, className, type = "button" }) => (
      <button type={type} onClick={onClick} className={`font-bold py-2 px-4 rounded-lg transition-colors ${className}`}>
        {children}
      </button>
    );

    const Header = ({ onBackToHome }) => (
      <header className="bg-[#8B4513] text-white p-4 shadow-md flex justify-between items-center">
        <h1 className="text-xl md:text-2xl font-bold">Dicionário Macuxi Multimídia</h1>
        <Button onClick={onBackToHome} className="text-sm hover:underline">Voltar ao Início</Button>
      </header>
    );

    // =================================================================================
    // DICIONÁRIO
    // =================================================================================
    const WordList = ({ words, onSelectWord, selectedWord, loading, error }) => (
      <div className="md:col-span-1 bg-white p-6 rounded-2xl shadow-lg h-full max-h-[70vh] overflow-y-auto">
        <h2 className="text-2xl font-bold mb-4 border-b-2 border-gray-200 pb-2">Palavras</h2>
        {loading && <p className="text-gray-500">A carregar palavras...</p>}
        {error && <p className="text-red-600 font-semibold">{error}</p>}
        {!loading && !error && (
          <div className="space-y-2">
            {words.length > 0 ? (
              words.map(word => (
                <div key={word.id} onClick={() => onSelectWord(word)}
                  className={`p-4 rounded-lg cursor-pointer border transition-all duration-200 ${
                    selectedWord && selectedWord.id === word.id
                      ? 'bg-yellow-100 border-yellow-300'
                      : 'bg-gray-50 border-gray-200 hover:bg-gray-100'
                  }`}>
                  <h3 className="font-bold text-lg text-[#8B4513] flex items-center">
                    {word.macuxi}{word.audio_url && <Icon name="volume" />}
                  </h3>
                  <p className="text-gray-600">{word.traducao_portugues}</p>
                </div>
              ))
            ) : (
              <p className="text-gray-500">Nenhuma palavra encontrada.</p>
            )}
          </div>
        )}
      </div>
    );

    const WordDetail = ({ word }) => {
      if (!word) {
        return (
          <div className="md:col-span-2 bg-white p-8 rounded-2xl shadow-lg flex items-center justify-center">
            <p className="text-xl text-gray-500">Selecione uma palavra na lista.</p>
          </div>
        );
      }
      return (
        <div className="md:col-span-2 bg-white p-8 rounded-2xl shadow-lg">
          <div className="text-center mb-6">
            <p className="text-lg font-semibold text-yellow-800 bg-yellow-200 rounded-full px-4 py-1 mb-4 inline-block">{word.classe_gramatical}</p>
            <h2 className="text-5xl md:text-6xl font-bold text-[#8B4513] mb-2">{word.macuxi}</h2>
            <p className="text-3xl text-gray-700">{word.traducao_portugues}</p>
            {word.ingles && <p className="text-2xl text-gray-500 mt-1">({word.ingles})</p>}
          </div>
          {word.audio_url && (
            <div className="mb-6">
              <h3 className="font-bold text-lg mb-2 text-gray-700">Pronúncia</h3>
              <audio controls key={word.id} className="w-full" src={word.audio_url}>O seu navegador não suporta o elemento de áudio.</audio>
            </div>
          )}
          {(word.exemplo_macuxi || word.exemplo_portugues) && (
            <div>
              <h3 className="font-bold text-lg mb-2 text-gray-700">Exemplo de Uso</h3>
              <div className="bg-gray-100 p-4 rounded-lg text-left">
                <p className="text-lg italic text-gray-800">"{word.exemplo_macuxi}"</p>
                <p className="text-md text-gray-600 mt-1">"{word.exemplo_portugues}"</p>
              </div>
            </div>
          )}
        </div>
      );
    };

    const DictionaryPage = ({ onBackToHome, initialSearch, searchMode, onSearchModeChange }) => {
      const [allWords, setAllWords] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');

      useEffect(() => { setSearchTerm(initialSearch || ''); }, [initialSearch]);

      useEffect(() => {
        const fetchAllWords = async () => {
          setLoading(true);
          setError(null);
          let allData = [];
          let from = 0;
          const chunkSize = 1000;
          while (true) {
            const { data, error: fetchError } = await supabaseClient
              .from(config.tableName).select('*')
              .order('macuxi', { ascending: true })
              .range(from, from + chunkSize - 1);
            if (fetchError) {
              setError(`Falha ao buscar palavras. Verifique o nome da tabela ('${config.tableName}') e as permissões (RLS).`);
              setLoading(false);
              return;
            }
            if (data) {
              allData = [...allData, ...data];
              if (data.length < chunkSize) break;
              from += chunkSize;
            } else { break; }
          }
          setAllWords(allData);
          setLoading(false);
        };
        fetchAllWords();
      }, []);

      const filteredWords = useMemo(() => {
        const term = (searchTerm || '').toLowerCase().trim();
        if (!term) return allWords;
        if (searchMode === 'macuxi') {
          return allWords.filter(word => word.macuxi && word.macuxi.toLowerCase().startsWith(term));
        }
        return allWords.filter(word =>
          (word.macuxi && word.macuxi.toLowerCase().includes(term)) ||
          (word.traducao_portugues && word.traducao_portugues.toLowerCase().includes(term))
        );
      }, [searchTerm, allWords, searchMode]);

      const [selectedWord, setSelectedWord] = useState(null);

      // Não seleciona nada automaticamente — o detalhe só abre quando o usuário clica.
      // Se a palavra selecionada sair do filtro atual, a seleção é limpa.
      useEffect(() => {
        if (selectedWord && !filteredWords.some(w => w.id === selectedWord.id)) {
          setSelectedWord(null);
        }
      }, [filteredWords]);

      return (
        <div className="bg-[#f4f1e9] min-h-screen text-gray-800">
          <Header onBackToHome={onBackToHome} />
          <main className="container mx-auto p-4 md:p-8">
            <div className="mb-8">
              <div className="relative">
                <input type="text" value={searchTerm}
                  onChange={(e) => { setSearchTerm(e.target.value); onSearchModeChange('all'); }}
                  placeholder="Buscar em Macuxi ou Português..."
                  className="w-full p-4 pr-10 border-2 border-gray-300 rounded-full focus:outline-none focus:border-[#8B4513] focus:ring-1 focus:ring-[#8B4513]" />
                <Icon name="search" />
              </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              <WordList words={filteredWords} onSelectWord={setSelectedWord} selectedWord={selectedWord} loading={loading} error={error} />
              <WordDetail word={selectedWord} />
            </div>
          </main>
        </div>
      );
    };

    // =================================================================================
    // ADMIN
    // =================================================================================
    const emptyVerbete = {
      macuxi: '', classe_gramatical: '', traducao_portugues: '',
      exemplo_macuxi: '', exemplo_portugues: '', ingles: '', audio_url: '', categoria_id: ''
    };

    const AdminPanel = ({ onBackToHome }) => {
      const [items, setItems] = useState([]);
      const [selected, setSelected] = useState(null);
      const [form, setForm] = useState(emptyVerbete);

      // 'lista' = navegação pelos verbetes | 'form' = especificações da palavra
      const [modo, setModo] = useState('lista');
      const scrollPosRef = React.useRef(0);

      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [saveMsg, setSaveMsg] = useState('');
      const [error, setError] = useState('');
      const [q, setQ] = useState('');
      const [letra, setLetra] = useState('A');

      const alfabeto = ['A', 'E', 'F', 'H', 'I', 'Î', 'K', 'M', 'N', 'O', 'P', 'S', 'T', 'U', 'V', 'W', 'X', 'Y'];

      // silent=true: atualiza os dados sem exibir "Carregando..."
      // Busca em blocos de 1000 porque o Supabase limita cada requisição a 1000 linhas.
      const fetchItems = async (silent = false) => {
        if (!silent) setLoading(true);
        setError('');

        let todos = [];
        let from = 0;
        const bloco = 1000;

        while (true) {
          const { data, error } = await supabaseClient
            .from(config.tableName).select('*')
            .order('macuxi', { ascending: true })
            .range(from, from + bloco - 1);

          if (error) {
            setError(`Erro ao carregar: ${error.message}`);
            if (!silent) setLoading(false);
            return;
          }

          if (data && data.length) {
            todos = todos.concat(data);
            if (data.length < bloco) break;
            from += bloco;
          } else {
            break;
          }
        }

        setItems(todos);
        if (!silent) setLoading(false);
      };

      useEffect(() => { fetchItems(); }, []);

      const filtered = useMemo(() => {
        const term = (q || '').toLowerCase().trim();

        // Com busca ativa, ignora o filtro de letra e procura no acervo inteiro
        if (term) {
          return items.filter(it =>
            (it.macuxi || '').toLowerCase().includes(term) ||
            (it.traducao_portugues || '').toLowerCase().includes(term)
          );
        }

        if (letra) {
          return items.filter(it => {
            const primeira = (it.macuxi || '').charAt(0).toUpperCase();
            return primeira === letra;
          });
        }

        return items;
      }, [q, items, letra]);

      const preencherForm = (it) => setForm({
        macuxi: it.macuxi || '', classe_gramatical: it.classe_gramatical || '',
        traducao_portugues: it.traducao_portugues || '', exemplo_macuxi: it.exemplo_macuxi || '',
        exemplo_portugues: it.exemplo_portugues || '', ingles: it.ingles || '',
        audio_url: it.audio_url || '', categoria_id: it.categoria_id || ''
      });

      const selectItem = (it) => {
        scrollPosRef.current = window.scrollY;
        setSelected(it);
        preencherForm(it);
        setSaveMsg('');
        setError('');
        setModo('form');
        window.scrollTo(0, 0);
      };

      // troca o verbete dentro da tela de edição, sem sair do modo 'form'
      const selectItemInline = (it) => {
        setSelected(it);
        preencherForm(it);
        setSaveMsg('');
        setError('');
      };

      const newItem = () => {
        scrollPosRef.current = window.scrollY;
        setSelected(null);
        setForm(emptyVerbete);
        setSaveMsg('');
        setError('');
        setModo('form');
        window.scrollTo(0, 0);
      };

      const voltarLista = () => {
        setModo('lista');
        setSaveMsg('');
        setError('');
        // devolve o usuário ao ponto exato de onde ele saiu
        setTimeout(() => window.scrollTo(0, scrollPosRef.current), 0);
      };

      const onChange = (key, val) => setForm(prev => ({ ...prev, [key]: val }));

      const save = async () => {
        setSaving(true);
        setError('');
        setSaveMsg('');
        if (!form.macuxi.trim()) { setError('Preencha o campo Macuxi (obrigatório).'); setSaving(false); return; }
        if (!form.traducao_portugues.trim()) { setError('Preencha a Tradução em português (obrigatório).'); setSaving(false); return; }

        const payload = {
          ...form,
          macuxi: form.macuxi.trim(), traducao_portugues: form.traducao_portugues.trim(),
          classe_gramatical: form.classe_gramatical.trim(), exemplo_macuxi: form.exemplo_macuxi.trim(),
          exemplo_portugues: form.exemplo_portugues.trim(), ingles: form.ingles.trim(),
          audio_url: form.audio_url.trim(), categoria_id: form.categoria_id.trim()
        };

        let res;
        if (selected?.id) {
          res = await supabaseClient.from(config.tableName).update(payload).eq('id', selected.id).select().single();
        } else {
          res = await supabaseClient.from(config.tableName).insert(payload).select().single();
        }

        if (res.error) { setError(`Erro ao salvar: ${res.error.message}`); setSaving(false); return; }

        await fetchItems(true);
        setSelected(res.data);
        preencherForm(res.data);

        setSaveMsg('✅ Salvo com sucesso!');
        setSaving(false);
        setTimeout(() => setSaveMsg(''), 2500);
      };

      const remove = async () => {
        if (!selected?.id) return;
        const ok = confirm(`Excluir o verbete "${selected.macuxi}"?`);
        if (!ok) return;
        setSaving(true);
        setError('');
        const { error } = await supabaseClient.from(config.tableName).delete().eq('id', selected.id);
        if (error) { setError(`Erro ao excluir: ${error.message}`); setSaving(false); return; }
        await fetchItems(true);
        setSaving(false);
        voltarLista();
      };

      const logout = async () => { await supabaseClient.auth.signOut(); onBackToHome(); };

      return (
        <div className="min-h-screen bg-[#f4f1e9] text-gray-800">
          <header className="bg-[#8B4513] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-20">
            <h1 className="text-xl font-bold">Painel Admin — Verbetes</h1>
            <div className="flex gap-2">
              <Button onClick={logout} className="text-sm hover:underline">Sair</Button>
              <Button onClick={onBackToHome} className="text-sm hover:underline">Voltar ao site</Button>
            </div>
          </header>

          {/* ══════════════════ TELA 1 — LISTA ══════════════════ */}
          {modo === 'lista' && (
            <>
              {/* ── BARRA DO ALFABETO (fixa ao rolar) ── */}
              <div className="bg-white border-b border-gray-200 shadow-sm sticky top-[60px] z-10">
                <div className="container mx-auto px-4 py-3 max-w-5xl flex flex-wrap items-center gap-1.5">
                  <button
                    onClick={() => { setLetra(''); setQ(''); }}
                    className={`h-9 px-3 text-sm font-bold rounded-md transition-colors ${
                      letra === '' && !q ? 'bg-[#8B4513] text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }`}>
                    Todas
                  </button>
                  {alfabeto.map(l => (
                    <button
                      key={l}
                      onClick={() => { setLetra(l); setQ(''); }}
                      className={`w-9 h-9 text-sm font-bold rounded-md transition-colors ${
                        letra === l && !q ? 'bg-[#8B4513] text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                      }`}>
                      {l}
                    </button>
                  ))}

                  <Button onClick={newItem}
                    className="ml-auto bg-[#FFC107] text-[#8B4513] hover:bg-yellow-500 text-sm">
                    + Novo verbete
                  </Button>
                </div>
              </div>

              <main className="container mx-auto px-4 py-8 max-w-5xl">
                {/* ── LETRA DA SEÇÃO ── */}
                <div className="flex items-baseline justify-between mb-5">
                  <h2 className="text-5xl font-bold text-[#8B4513]">
                    {q ? 'Busca' : (letra || 'Todas')}
                  </h2>
                  <span className="text-sm text-gray-500 font-semibold">
                    {filtered.length} {filtered.length === 1 ? 'verbete' : 'verbetes'}
                  </span>
                </div>

                {/* ── BUSCA ── */}
                <div className="relative mb-6">
                  <input
                    className="w-full border-2 border-gray-300 rounded-full p-4 pr-11 focus:outline-none focus:border-[#8B4513]"
                    placeholder="Buscar em todo o dicionário (Macuxi ou Português)..."
                    value={q}
                    onChange={(e) => setQ(e.target.value)}
                  />
                  <Icon name="search" />
                </div>

                {loading && <p className="text-gray-500">Carregando verbetes...</p>}
                {error && <p className="text-red-600 font-semibold">{error}</p>}

                {/* ── LISTA EM LARGURA TOTAL ── */}
                {!loading && (
                  <div className="space-y-2">
                    {filtered.map(it => (
                      <div
                        key={it.id}
                        onClick={() => selectItem(it)}
                        className="group bg-white border border-gray-200 rounded-xl px-5 py-3.5 cursor-pointer hover:border-[#8B4513] hover:shadow-md transition-all flex items-center gap-3"
                      >
                        <div className="flex-grow min-w-0">
                          <span className="font-bold text-lg text-[#8B4513]">{it.macuxi}</span>
                          {it.traducao_portugues && (
                            <span className="text-gray-600"> — {it.traducao_portugues}</span>
                          )}
                          {it.classe_gramatical && (
                            <span className="ml-2 text-[11px] font-semibold uppercase tracking-wide text-yellow-800 bg-yellow-100 px-2 py-0.5 rounded-full whitespace-nowrap">
                              {it.classe_gramatical}
                            </span>
                          )}
                        </div>

                        {it.audio_url && <Icon name="volume" />}

                        <span className="text-xs font-bold text-gray-300 group-hover:text-[#8B4513] transition-colors shrink-0">
                          EDITAR →
                        </span>
                      </div>
                    ))}

                    {!filtered.length && (
                      <p className="text-gray-500 text-center py-12">Nenhum verbete encontrado.</p>
                    )}
                  </div>
                )}
              </main>
            </>
          )}

          {/* ══════════════════ TELA 2 — EDIÇÃO (2 COLUNAS) ══════════════════ */}
          {modo === 'form' && (
            <main className="container mx-auto px-4 py-6 max-w-6xl">
              <button
                onClick={voltarLista}
                className="text-sm font-bold text-[#8B4513] hover:underline mb-4 inline-flex items-center gap-1">
                ← Voltar à lista completa
              </button>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                {/* ── COLUNA ESQUERDA: NAVEGAÇÃO ── */}
                <aside className="md:col-span-1 bg-white rounded-2xl shadow-lg p-4 h-[78vh] flex flex-col">
                  {/* busca */}
                  <div className="relative mb-3">
                    <input
                      className="w-full border-2 border-gray-200 rounded-full py-2.5 px-4 pr-9 text-sm focus:outline-none focus:border-[#8B4513]"
                      placeholder="Buscar verbete..."
                      value={q}
                      onChange={(e) => setQ(e.target.value)}
                    />
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="absolute top-1/2 right-3 -translate-y-1/2 text-gray-400">
                      <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                  </div>

                  {/* alfabeto compacto (desativado durante a busca) */}
                  <div className="flex flex-wrap gap-1 mb-3">
                    {alfabeto.map(l => (
                      <button
                        key={l}
                        onClick={() => { setLetra(l); setQ(''); }}
                        className={`w-7 h-7 text-xs font-bold rounded transition-colors ${
                          letra === l && !q ? 'bg-[#8B4513] text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}>
                        {l}
                      </button>
                    ))}

      const handleReset = async () => {
        if (!resetEmail.trim()) { setResetMsg('Digite seu email.'); return; }
        const { error } = await supabaseClient.auth.resetPasswordForEmail(resetEmail, { redirectTo: window.location.origin });
        if (error) { setResetMsg('Erro: ' + error.message); }
        else { setResetMsg('✅ Email enviado! Verifique sua caixa de entrada.'); }
      };

      const handleLogin = async () => {
        setLoading(true);
        setMsg('');
        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) { setMsg('Falha no login: ' + error.message); return; }
          const userId = data?.user?.id || data?.session?.user?.id;
          if (!userId) { setMsg('Login OK, mas não consegui obter o userId.'); return; }
          const { data: adminRow, error: adminErr } = await supabaseClient
            .from('admins').select('user_id').eq('user_id', userId).maybeSingle();
          if (adminErr) { setMsg('Erro ao verificar permissão: ' + adminErr.message); return; }
          if (!adminRow) {
            await supabaseClient.auth.signOut();
            setMsg('Você entrou, mas NÃO tem permissão de admin (não está na tabela admins).');
            return;
          }
          onLoginSuccess();
        } catch (e) {
          setMsg('Erro inesperado: ' + (e?.message || String(e)));
        } finally {
          setLoading(false);
        }
      };

    // =================================================================================
    // RESET DE SENHA
    // =================================================================================
    const ResetPasswordPage = ({ onDone }) => {
      const [password, setPassword] = useState('');
      const [confirm, setConfirm] = useState('');
      const [msg, setMsg] = useState('');
      const [success, setSuccess] = useState(false);

      const handleReset = async () => {
        if (!password.trim()) { setMsg('Digite a nova senha.'); return; }
        if (password.length < 6) { setMsg('A senha deve ter pelo menos 6 caracteres.'); return; }
        if (password !== confirm) { setMsg('As senhas não coincidem.'); return; }
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) { setMsg('Erro: ' + error.message); }
        else { setSuccess(true); setTimeout(onDone, 2000); }
      };

      return (
        <div className="min-h-screen bg-[#f4f1e9] flex flex-col">
          <header className="bg-[#8B4513] text-white p-6 shadow-md flex justify-center">
            <h1 className="text-2xl font-bold">Dicionário Macuxi Multimídia</h1>
          </header>
          <main className="flex-grow flex items-center justify-center p-6">
            <div className="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
              <h2 className="text-2xl font-bold mb-2 text-gray-800">Redefinir Senha</h2>
              <p className="text-gray-500 text-sm mb-6">Digite e confirme sua nova senha.</p>
              {success ? (
                <div className="text-center">
                  <p className="text-green-600 font-bold text-lg">✅ Senha alterada com sucesso!</p>
                  <p className="text-gray-500 text-sm mt-2">Redirecionando...</p>
                </div>
              ) : (
                <>
                  <label className="block text-sm font-semibold mb-1 text-gray-700">Nova senha</label>
                  <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)}
                    className="w-full border-2 border-gray-200 rounded-lg p-3 mb-4 focus:outline-none focus:border-[#8B4513]" />
                  <label className="block text-sm font-semibold mb-1 text-gray-700">Confirmar senha</label>
                  <input type="password" placeholder="••••••••" value={confirm} onChange={e => setConfirm(e.target.value)}
                    className="w-full border-2 border-gray-200 rounded-lg p-3 mb-4 focus:outline-none focus:border-[#8B4513]" />
                  {msg && <p className="text-red-600 text-sm font-semibold mb-4">{msg}</p>}
                  <button onClick={handleReset} className="w-full bg-[#8B4513] text-white font-bold py-3 rounded-lg hover:bg-[#a0522d]">
                    Salvar Nova Senha
                  </button>
                </>
              )}
            </div>
          </main>
        </div>
      );
    };

    // =================================================================================
    // APP
    // =================================================================================
    const App = () => {
      const [currentPage, setCurrentPage] = useState('landing');
      const [initialSearch, setInitialSearch] = useState('');
      const [searchMode, setSearchMode] = useState('all');
      const [isAdmin, setIsAdmin] = useState(false);

      useEffect(() => {
        const hash = window.location.hash;
        if (hash.includes('type=recovery')) setCurrentPage('reset-password');
        const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          if (_event === 'PASSWORD_RECOVERY') {
            setCurrentPage('reset-password');
          } else if (session?.user?.id) {
            isUserAdmin(session.user.id).then(setIsAdmin);
          } else {
            setIsAdmin(false);
          }
        });
        return () => sub?.subscription?.unsubscribe();
      }, []);

      const pageRender = () => {
        switch (currentPage) {
          case 'dictionary':
            return (
              <DictionaryPage
                onBackToHome={() => setCurrentPage('landing')}
                initialSearch={initialSearch}
                searchMode={searchMode}
                onSearchModeChange={setSearchMode}
              />
            );
          case 'reset-password':
            return <ResetPasswordPage onDone={() => setCurrentPage('landing')} />;
          case 'admin':
            return isAdmin ? (
              <AdminPanel onBackToHome={() => setCurrentPage('landing')} />
            ) : (
              <AdminLogin
                onBackToHome={() => setCurrentPage('landing')}
                onLoginSuccess={() => setIsAdmin(true)}
              />
            );
          default:
            return (
              <LandingPage
                onEnter={(letter) => {
                  setInitialSearch(letter);
                  if (letter) setSearchMode('macuxi');
                  else setSearchMode('all');
                  setCurrentPage('dictionary');
                }}
                onAdmin={() => setCurrentPage('admin')}
              />
            );
        }
      };

      return <div>{pageRender()}</div>;
    };

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
